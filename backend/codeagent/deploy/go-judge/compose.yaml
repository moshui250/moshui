services:
  go-judge:
    build:
      context: .
      args:
        GOJUDGE_VERSION: "1.14.0"
    image: codeagent/go-judge:1.14.0
    container_name: codeagent-gojudge
    # go-judge 需要创建命名空间和 seccomp 沙箱；生产部署必须限制在受信网络。
    privileged: true
    shm_size: 256m
    ports:
      - "127.0.0.1:5050:5050"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5050/version"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
